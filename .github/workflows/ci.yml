name: CI

on:
  push:
    paths-ignore:
      # Docs-only pushes skip CI: no code under test changed. PRs always
      # run the full gate (review safety).
      - '**.md'
      - '**.png'
      - '**.dot'
      - 'docs/**'
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # NOTE: the two -A flags are required. Plain `-D warnings` fails on
      # `field_reassign_with_default` (ulpf-core) and `too_many_arguments`.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -A clippy::too_many_arguments -A clippy::field_reassign_with_default -D warnings
      - name: Format
        run: cargo fmt --all -- --check
      # NOTE: test_classification_sub_microsecond_benchmark (issue #58) is
      # deterministic since the warmup + median-of-rounds + release-gated
      # rewrite — it runs in CI like every other test, no --skip. The strict
      # < 2 µs gate applies to release builds; debug asserts a loose smoke
      # bound (see the test's doc comment and AGENTS.md Gotchas).
      - name: Tests
        run: cargo test --workspace
